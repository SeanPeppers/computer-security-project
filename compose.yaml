# One throwaway test machine on localhost, for building and testing scripts.
# Ports are bound to 127.0.0.1 only: an open Docker API is root on whatever can reach it.
services:
  target:
    build: ./docker
    privileged: true  # needed for Docker inside the container
    hostname: target
    environment:
      ROOT_PASSWORD: ${ROOT_PASSWORD:?copy .env.example to .env and set a password}
    ports:
      - "127.0.0.1:${SSH_PORT:-2222}:22"
      - "127.0.0.1:${API_PORT:-2375}:2375"
    volumes:
      - docker-data:/var/lib/docker

volumes:
  docker-data:
