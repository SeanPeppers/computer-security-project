name: smoke test
on: [push, pull_request]
jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: shellcheck docker/entrypoint.sh scripts/example.sh scripts/fingerprint.sh
      - name: start the test machine
        run: |
          printf 'ROOT_PASSWORD=ci-only\n' > .env
          docker compose up -d --build
          for i in $(seq 90); do docker compose logs | grep -q 'test machine ready' && break; sleep 2; done
          docker compose logs
          docker compose logs | grep -q 'test machine ready'
      - name: Docker API answers, only on localhost
        run: |
          curl -sf http://127.0.0.1:2375/version
          docker compose port target 2375 | grep -q '^127.0.0.1:'
      - name: example.sh logs an API check
        run: |
          PAUSE=1 scripts/example.sh api /_ping
          grep -c '^OK$' evidence.log | grep -qx 2
      - name: SSH accepts root by password
        run: |
          sudo apt-get install -y sshpass >/dev/null
          sshpass -p ci-only ssh -o StrictHostKeyChecking=no -p 2222 root@127.0.0.1 'id -u' | grep -qx 0
      - name: fingerprint.sh compares A and B and flags the container
        run: |
          # A and B default to the same box, so signals match but the honeypot tells still fire.
          SSHPASS=ci-only SSH_OPTS="-o PreferredAuthentications=password -o PubkeyAuthentication=no" \
            sshpass -e scripts/fingerprint.sh
          grep -q 'A and B look identical on every signal' fingerprint.log
          grep -q '/.dockerenv present' fingerprint.log
