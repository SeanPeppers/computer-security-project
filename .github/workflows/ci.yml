name: smoke test
on: [push, pull_request]
jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: shellcheck docker/entrypoint.sh scripts/compare.sh
      - name: start both test machines
        run: |
          printf 'ROOT_PASSWORD=ci-only\n' > .env
          docker compose up -d --build
          for i in $(seq 90); do [ "$(docker compose logs | grep -c 'test machine ready')" = 2 ] && break; sleep 2; done
          docker compose logs
      - name: Docker API answers on both, only on localhost
        run: |
          curl -sf http://127.0.0.1:23751/version
          curl -sf http://127.0.0.1:23752/version
          docker compose port target-a 2375 | grep -q '^127.0.0.1:'
      - name: SSH accepts root by password
        run: |
          sudo apt-get install -y sshpass >/dev/null
          sshpass -p ci-only ssh -o StrictHostKeyChecking=no -p 2221 root@127.0.0.1 'id -u' | grep -qx 0
